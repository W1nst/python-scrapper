[project]
name = "tourvisor-mcp"
version = "0.1.0"
description = "MCP server for searching tours on tourvisor.ru"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tourvisor-mcp = "tourvisor_mcp.server:main"
tourvisor-mcp-lite = "tourvisor_mcp.stdio_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit the real tourvisor.ru API (network required)",
]
